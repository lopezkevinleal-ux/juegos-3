<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Simón dice</title>

    <!-- Conector CSS -->
    <link rel="stylesheet" href="juego.css">
</head>

<body>

    <div class="juego">
        <h3>Simon dice</h3>

        <p>
            Memoriza y repite la secuencia de colores.
            Ronda: <span id="rondaSimon">0</span>
        </p>

        <div class="tableroSimon">
            <button class="colorSimon" data-color="0" id="colorVerde"></button>
            <button class="colorSimon" data-color="1" id="colorRojo"></button>
            <button class="colorSimon" data-color="2" id="colorAmarillo"></button>
            <button class="colorSimon" data-color="3" id="colorAzul"></button>
        </div>

        <p id="mensajeSimon"></p>

        <button id="btnIniciarSimon">Iniciar juego</button>
    </div>

    <!-- Conector JavaScript -->
    <script src="juego.js"></script>

</body>
</html>
